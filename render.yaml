# Render blueprint for the HackHub API.
# 1. Push this repository to GitHub.
# 2. In Render: New -> Blueprint -> select the repo. It reads this file.
# 3. Fill in MONGO_URI and CLIENT_URL when prompted.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hackhub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: "5000"
      # Skip the boot-time model download; the RAG endpoint loads it lazily.
      - key: PRELOAD_MODEL
        value: "false"
      # Render's free tier has 512 MB RAM - the MiniLM model needs headroom.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
